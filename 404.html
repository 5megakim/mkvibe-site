<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>페이지를 찾을 수 없습니다 — mkvibe</title>
  <link rel="icon" type="image/png" sizes="32x32" href="/assets/favicon-32.png" />
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
      background: #08080a;
      color: #f4f4f6;
      font-family: "Pretendard Variable", "Pretendard", -apple-system, sans-serif;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 24px;
      background-image:
        radial-gradient(ellipse 70% 50% at 0% -10%, rgba(255, 32, 80, 0.4), transparent 60%),
        radial-gradient(ellipse 60% 50% at 100% 0%, rgba(168, 85, 247, 0.3), transparent 60%);
    }
    .card { text-align: center; max-width: 400px; }
    .code {
      font-size: 96px;
      font-weight: 900;
      letter-spacing: -3px;
      background: linear-gradient(135deg, #ff2050, #a855f7, #6088ff);
      -webkit-background-clip: text;
      background-clip: text;
      -webkit-text-fill-color: transparent;
      line-height: 1;
      margin-bottom: 14px;
    }
    h1 { font-size: 22px; font-weight: 700; margin-bottom: 14px; }
    p { color: #a8a8b0; margin-bottom: 28px; }
    a {
      display: inline-block;
      padding: 12px 24px;
      background: linear-gradient(135deg, #ff2050, #ff5577);
      border-radius: 10px;
      color: white;
      text-decoration: none;
      font-weight: 700;
      box-shadow: 0 6px 20px rgba(255, 32, 80, 0.4);
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="code">404</div>
    <h1>페이지를 찾을 수 없습니다</h1>
    <p>요청하신 페이지가 존재하지 않거나 이동되었습니다.</p>
    <a href="/">← 홈으로 돌아가기</a>
  </div>
</body>
</html>
